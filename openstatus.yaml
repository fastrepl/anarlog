# yaml-language-server: $schema=https://www.openstatus.dev/schema.json

"11026":
  active: true
  assertions:
    - compare: eq
      kind: statusCode
      target: 200
  frequency: 1m
  kind: http
  name: Anarlog API
  openTelemetry: {}
  regions:
    - iad
    - arn
    - sin
    - syd
    - gru
    - jnb
  request:
    method: GET
    url: https://api.anarlog.so/health
  retry: 3
  timeout: 45000
