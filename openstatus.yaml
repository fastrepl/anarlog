"anarlog-sync-api":
  active: true
  assertions:
    - compare: eq
      kind: statusCode
      target: 401
    - compare: eq
      kind: textBody
      target: missing_authorization_header
  description: Verifies the production sync route and authentication layer.
  frequency: 1m
  kind: http
  name: Anarlog Sync API
  openTelemetry: {}
  regions:
    - iad
    - arn
    - sin
    - syd
    - gru
    - jnb
  request:
    method: GET
    url: https://api.anarlog.so/sync/devices
  retry: 3
  timeout: 45000
"anarlog-transcription-api":
  active: true
  assertions:
    - compare: eq
      kind: statusCode
      target: 401
    - compare: eq
      kind: textBody
      target: missing_authorization_header
  description: Verifies the production transcription route and authentication layer.
  frequency: 1m
  kind: http
  name: Anarlog Transcription API
  openTelemetry: {}
  regions:
    - iad
    - arn
    - sin
    - syd
    - gru
    - jnb
  request:
    method: GET
    url: https://api.anarlog.so/stt/status/openstatus-probe
  retry: 3
  timeout: 45000
"anarlog-llm-api":
  active: true
  assertions:
    - compare: eq
      kind: statusCode
      target: 401
    - compare: eq
      kind: textBody
      target: missing_authorization_header
  description: Verifies the production LLM route and authentication layer.
  frequency: 1m
  kind: http
  name: Anarlog LLM API
  openTelemetry: {}
  regions:
    - iad
    - arn
    - sin
    - syd
    - gru
    - jnb
  request:
    body: "{}"
    headers:
      Content-Type: application/json
    method: POST
    url: https://api.anarlog.so/llm/chat/completions
  retry: 3
  timeout: 45000
