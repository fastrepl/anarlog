on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - run: git fetch --tags --force
      - uses: $/.github/actions/doxxer_install
      - id: version
        run: |
          VERSION=$(doxxer --config doxxer.stripe.toml next patch)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Computed version: $VERSION"

  deploy:
    needs: compute-version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency: stripe-fly-deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - uses: $/.github/actions/infisical_install
      - run: |
          set -euo pipefail
          oidc_jwt=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')
          infisical_token=$(infisical login --method=oidc-auth \
            --machine-identity-id=7dde9440-cec4-4cf0-a13f-1588ba67feb2 \
            --jwt="$oidc_jwt" --silent --plain)
          echo "::add-mask::$infisical_token"
          echo "INFISICAL_TOKEN=$infisical_token" >> "$GITHUB_ENV"
      - run: |
          set -euo pipefail

          project_id="$(
            python3 -c 'import json; print(json.load(open(".infisical.json"))["workspaceId"])'
          )"
          posthog_api_key="$(
            infisical secrets get VITE_POSTHOG_API_KEY \
              --token="$INFISICAL_TOKEN" \
              --env=prod \
              --projectId="$project_id" \
              --path=/anarlog/web \
              --output=json |
              python3 -c 'import json, sys; print(json.load(sys.stdin)[0]["secretValue"])'
          )"
          loops_api_key="$(
            infisical secrets get LOOPS_KEY \
              --token="$INFISICAL_TOKEN" \
              --env=prod \
              --projectId="$project_id" \
              --path=/anarlog/web \
              --output=json |
              python3 -c 'import json, sys; print(json.load(sys.stdin)[0]["secretValue"])'
          )"

          echo "::add-mask::$posthog_api_key"
          echo "::add-mask::$loops_api_key"
          if [[ "$posthog_api_key" != phc_* || ${#posthog_api_key} -lt 20 ]]; then
            echo "Invalid Anarlog PostHog project token" >&2
            exit 1
          fi
          if [[ ${#loops_api_key} -lt 20 ]]; then
            echo "Invalid Anarlog Loops API key" >&2
            exit 1
          fi

          flyctl secrets set \
            POSTHOG_API_KEY="$posthog_api_key" \
            LOOPS_API_KEY="$loops_api_key" \
            --stage \
            --app hyprnote-stripe

          python3 .github/scripts/deploy_api_drain.py \
            --app hyprnote-stripe \
            --config apps/stripe/fly.toml \
            --dockerfile apps/stripe/Dockerfile \
            --version "$STRIPE_VERSION"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 https://hyprnote-stripe.fly.dev/health

          expected_hash="$(printf %s "$posthog_api_key" | sha256sum | cut -d " " -f 1)"
          actual_hash="$(
            flyctl ssh console \
              --app hyprnote-stripe \
              --command 'sh -lc '\''printf %s "$POSTHOG_API_KEY" | sha256sum | cut -d " " -f 1'\''' |
              grep -Eo '[0-9a-f]{64}' |
              tail -n 1
          )"
          if [[ "$actual_hash" != "$expected_hash" ]]; then
            echo "Deployed Stripe service has the wrong PostHog project token" >&2
            exit 1
          fi

          expected_loops_hash="$(printf %s "$loops_api_key" | sha256sum | cut -d " " -f 1)"
          actual_loops_hash="$(
            flyctl ssh console \
              --app hyprnote-stripe \
              --command 'sh -lc '\''printf %s "$LOOPS_API_KEY" | sha256sum | cut -d " " -f 1'\''' |
              grep -Eo '[0-9a-f]{64}' |
              tail -n 1
          )"
          if [[ "$actual_loops_hash" != "$expected_loops_hash" ]]; then
            echo "Deployed Stripe service has the wrong Loops API key" >&2
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          STRIPE_VERSION: ${{ needs.compute-version.outputs.version }}

  tag:
    needs: [compute-version, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: stripe_v${{ needs.compute-version.outputs.version }}
          tag_prefix: ""
