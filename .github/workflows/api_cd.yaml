on:
  workflow_dispatch:
    inputs:
      service:
        type: choice
        default: all
        options: [all, ai, sync, core, billing, gateway, legacy]
      image:
        description: Existing image digest for a verified rollback or shared build
        type: string
        required: false
      continuity_user:
        description: Optional QA account for live AI deployment and rollback (requires immutable image)
        type: string
        required: false
      cleanup_owner:
        description: Run durable cleanup on core after retiring old workers
        type: boolean
        default: false
      adopt_drain_image:
        description: Verified SIGUSR1-capable existing image digest to mark before deployment
        type: string
        required: false
      retire_idle_legacy_machine:
        description: Legacy API machine verified to have no active client connections; cordon then gracefully retire after deployment
        type: string
        required: false

env:
  INFISICAL_ENV: prod
  SERVICE: ${{ inputs.service || 'all' }}
  FLY_ORG: fastrepl

permissions:
  contents: read

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - run: git fetch --tags --force
      - uses: $/.github/actions/doxxer_install
      - id: version
        run: |
          VERSION=$(doxxer --config doxxer.api.toml next patch)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Computed version: $VERSION"

  deploy:
    needs: compute-version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: api-fly-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          case "$SERVICE" in
            all) app=anarlog-ai; config=apps/api/fly.toml; health=/health ;;
            ai) app=anarlog-inference; config=apps/api/fly.ai.toml; health=/health/ready/ai ;;
            sync) app=anarlog-sync; config=apps/api/fly.sync.toml; health=/health/ready/sync ;;
            core) app=anarlog-core; config=apps/api/fly.core.toml; health=/health/ready/core ;;
            billing) app=anarlog-billing-api; config=apps/api/fly.billing.toml; health=/health/ready/billing-api ;;
            gateway) app=anarlog-ai; config=apps/api/fly.gateway.toml; health=/health/ready/api ;;
            legacy) app=hyprnote-ai; config=apps/api/fly.legacy.toml; health=/health/ready/api ;;
            *) exit 1 ;;
          esac
          if [ "$CLEANUP_OWNER" = true ]; then
            test "$SERVICE" = core
            sed -i 's/ANARLOG_ATTACHMENT_BACKUP_GC_ENABLED = "false"/ANARLOG_ATTACHMENT_BACKUP_GC_ENABLED = "true"/' "$config"
          fi
          echo "FLY_APP=$app" >> "$GITHUB_ENV"
          echo "FLY_CONFIG=$config" >> "$GITHUB_ENV"
          echo "HEALTH_PATH=$health" >> "$GITHUB_ENV"
        env:
          CLEANUP_OWNER: ${{ inputs.cleanup_owner }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - uses: $/.github/actions/rust_install
        with:
          platform: linux
      - uses: $/.github/actions/infisical_install
      # Machine-identity OIDC login instead of a static service token: scopes
      # live in the identity's editable project role, so secret reorganizations
      # never require re-minting a token into GitHub secrets.
      - run: |
          set -euo pipefail
          oidc_jwt=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')
          infisical_token=$(infisical login --method=oidc-auth \
            --machine-identity-id=7dde9440-cec4-4cf0-a13f-1588ba67feb2 \
            --jwt="$oidc_jwt" --silent --plain)
          echo "::add-mask::$infisical_token"
          echo "INFISICAL_TOKEN=$infisical_token" >> "$GITHUB_ENV"
      - run: |
          set -euo pipefail

          python3 .github/scripts/test_verify_cloudsync_e2ee.py

          cloudsync_secrets_json="$(mktemp)"
          trap 'rm -f "$cloudsync_secrets_json"' EXIT

          infisical export \
            --token="$INFISICAL_TOKEN" \
            --env="$INFISICAL_ENV" \
            --projectId="$INFISICAL_PROJECT_ID" \
            --path="/anarlog/cloudsync" \
            --format=json \
            --output-file="$cloudsync_secrets_json"

          python3 .github/scripts/verify_cloudsync_e2ee.py "$cloudsync_secrets_json"
        env:
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
      - run: |
          set -euo pipefail
          apps="$(flyctl apps list --org "$FLY_ORG" --json)"
          if ! jq -e --arg app "$FLY_APP" 'any(.[]; (.Name // .name) == $app)' <<< "$apps" >/dev/null; then
            flyctl apps create "$FLY_APP" --org "$FLY_ORG" --yes
            flyctl ips allocate-v6 --app "$FLY_APP"
            flyctl ips allocate-v4 --shared --app "$FLY_APP"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: |
          set -euo pipefail

          ai_secrets_json="$(mktemp)"
          cloudsync_secrets_json="$(mktemp)"
          secrets_file="$(mktemp)"
          trap 'rm -f "$ai_secrets_json" "$cloudsync_secrets_json" "$secrets_file"' EXIT

          infisical export \
            --token="$INFISICAL_TOKEN" \
            --env="$INFISICAL_ENV" \
            --projectId="$INFISICAL_PROJECT_ID" \
            --path="/anarlog/ai" \
            --format=json \
            --output-file="$ai_secrets_json"

          infisical export \
            --token="$INFISICAL_TOKEN" \
            --env="$INFISICAL_ENV" \
            --projectId="$INFISICAL_PROJECT_ID" \
            --path="/anarlog/cloudsync" \
            --format=json \
            --output-file="$cloudsync_secrets_json"

          python3 .github/scripts/prepare_api_service_secrets.py \
            --service "$SERVICE" --api "$ai_secrets_json" \
            --cloudsync "$cloudsync_secrets_json" --output "$secrets_file"

          if [ -s "$secrets_file" ]; then
            flyctl secrets import --app "$FLY_APP" --stage < "$secrets_file"
          else
            echo "No Infisical secrets exported; skipping Fly secret import."
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
      - if: inputs.service == 'gateway' || inputs.service == 'legacy'
        run: |
          set -euo pipefail
          for entry in anarlog-inference:ai anarlog-sync:sync anarlog-core:core anarlog-billing-api:billing-api; do
            app="${entry%%:*}"
            role="${entry#*:}"
            curl --fail --silent --show-error --retry 3 "https://${app}.fly.dev/health/ready/${role}"
          done
      - run: |
          set -euo pipefail
          args=(--app "$FLY_APP" --config "$FLY_CONFIG" --dockerfile apps/api/Dockerfile --version "$API_VERSION")
          if [ -n "$DEPLOY_IMAGE" ]; then args+=(--image "$DEPLOY_IMAGE"); fi
          if [ -n "$ADOPT_DRAIN_IMAGE" ]; then args+=(--adopt-drain-image "$ADOPT_DRAIN_IMAGE"); fi
          if [ -n "$RETIRE_IDLE_LEGACY_MACHINE" ]; then
            test "$SERVICE" = legacy
            args+=(--retire-idle-legacy-api-machine "$RETIRE_IDLE_LEGACY_MACHINE")
          fi
          if [ -n "$CONTINUITY_USER" ]; then
            test "$SERVICE" = ai
            test -n "$DEPLOY_IMAGE"
            qa_secrets="$(mktemp)"
            chmod 600 "$qa_secrets"
            trap 'rm -f "$qa_secrets"' EXIT
            infisical export --token="$INFISICAL_TOKEN" --env="$INFISICAL_ENV" \
              --projectId="$INFISICAL_PROJECT_ID" --path=/anarlog/ai --format=json --output-file="$qa_secrets"
            python3 -m venv "$RUNNER_TEMP/continuity-venv"
            "$RUNNER_TEMP/continuity-venv/bin/pip" install httpx==0.28.1 websockets==15.0.1
            "$RUNNER_TEMP/continuity-venv/bin/python" .github/scripts/verify_api_continuity.py \
              --app "$FLY_APP" --config "$FLY_CONFIG" --dockerfile apps/api/Dockerfile \
              --version "$API_VERSION" --image "$DEPLOY_IMAGE" --secrets "$qa_secrets" \
              --email "$CONTINUITY_USER" --output "$RUNNER_TEMP/api-continuity.json"
          else
            python3 .github/scripts/deploy_api_drain.py "${args[@]}"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          API_VERSION: ${{ needs.compute-version.outputs.version }}
          DEPLOY_IMAGE: ${{ inputs.image }}
          CONTINUITY_USER: ${{ inputs.continuity_user }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          ADOPT_DRAIN_IMAGE: ${{ inputs.adopt_drain_image }}
          RETIRE_IDLE_LEGACY_MACHINE: ${{ inputs.retire_idle_legacy_machine }}
      - run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "https://${FLY_APP}.fly.dev${HEALTH_PATH}"
          flyctl machine list --app "$FLY_APP" --json | jq '[.[] | {id, state, region, image: .config.image, image_ref}]'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - if: always() && inputs.continuity_user != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-continuity
          path: ${{ runner.temp }}/api-continuity.json
          retention-days: 14
      - if: failure()
        run: timeout 60s flyctl logs --app "$FLY_APP" --no-tail || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  tag:
    if: ${{ (inputs.service == 'all' || inputs.service == '') && inputs.image == '' }}
    needs: [compute-version, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: api_v${{ needs.compute-version.outputs.version }}
          tag_prefix: ""
