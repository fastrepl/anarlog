on:
  workflow_dispatch:

jobs:
  sign-passthrough:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - run: mkdir -p build

      - uses: ./.github/actions/apple_cert
        id: apple-cert
        with:
          apple-certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Compile and sign passthrough binary
        env:
          CERT_ID: ${{ steps.apple-cert.outputs.cert-id }}
        run: |
          swiftc scripts/passthrough.swift -o build/anarlog-passthrough
          codesign -s "$CERT_ID" build/anarlog-passthrough

          # Verify signing
          codesign -dv build/anarlog-passthrough

          # Verify team identifier is correct
          if ! codesign -dv build/anarlog-passthrough 2>&1 | grep -q "TeamIdentifier=6SLY7V277V"; then
            echo "Error: Binary not signed with correct team identifier (6SLY7V277V)"
            exit 1
          fi
          echo "✓ Binary signed with correct team identifier"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anarlog-passthrough-${{ github.sha }}
          path: |
            build/anarlog-passthrough
          retention-days: 7
