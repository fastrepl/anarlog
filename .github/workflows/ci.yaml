on:
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: |
          python3 .github/scripts/test_check_license_boundary.py
          python3 .github/scripts/check_license_boundary.py
      - run: node scripts/sync-desktop-changelogs.mjs --check
      - run: node scripts/release-version.mjs --check
      - run: node scripts/release-version.mjs --mobile --check
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - run: >-
          node --test
          scripts/dev.test.mjs
          scripts/pr-description.test.mjs
          scripts/release-version.test.mjs
          scripts/notarize-dmg.test.mjs
          scripts/changelog-bundle.test.mjs
          scripts/changelog-baseline.test.mjs
          scripts/verify-release-candidate.test.mjs
          scripts/desktop-release-provenance.test.mjs
          scripts/workflow-security.test.mjs
          scripts/security-dependencies.test.mjs
          scripts/publish-anarlog-skill.test.mjs
          scripts/repack-linux-appimage.test.mjs
          scripts/verify-linux-audio-qa-run.test.mjs
          scripts/verify-linux-audio-qa-evidence.test.mjs
          scripts/update-apt-repository.test.mjs
          scripts/verify-apt-repository.test.mjs
          scripts/update-aur-pkgbuild.test.mjs
