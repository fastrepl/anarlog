name: PR description

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - env:
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'NODE'
          const title = (process.env.PR_TITLE || "").trim();
          const body = process.env.PR_BODY || "";
          const errors = [];
          const maintainerAssociations = new Set(["COLLABORATOR", "MEMBER", "OWNER"]);

          if (
            process.env.PR_AUTHOR_TYPE === "Bot" ||
            maintainerAssociations.has(process.env.PR_AUTHOR_ASSOCIATION)
          ) {
            console.log(
              "Maintainer or bot pull request; description validation is not required.",
            );
            process.exit(0);
          }

          if (title.length < 12) {
            errors.push("Title must be at least 12 characters.");
          }

          if (title.split(/\s+/).length < 3) {
            errors.push("Title must state the intended outcome in at least three words.");
          }

          if (/^(wip|draft|changes?|updates?|fix(?:es)?|pull request|pr)(?:\s*[:#-]?\s*\d+)?$/i.test(title)) {
            errors.push("Title is too generic. State what this PR intends to accomplish.");
          }

          function stripHtmlComments(markdown) {
            let inComment = false;
            let fenceMarker = "";

            return markdown.split("\n").map((line) => {
              const leadingMarker = line.match(/^ {0,3}(`+|~+)/)?.[1] || "";
              if (!inComment && leadingMarker.length >= 3) {
                if (!fenceMarker) {
                  fenceMarker = leadingMarker;
                } else if (
                  leadingMarker[0] === fenceMarker[0] &&
                  leadingMarker.length >= fenceMarker.length &&
                  line.trimStart().slice(leadingMarker.length).trim() === ""
                ) {
                  fenceMarker = "";
                }
                return line;
              }

              if (fenceMarker) return line;

              let visible = "";
              let inlineTicks = 0;
              for (let index = 0; index < line.length;) {
                if (inComment) {
                  const commentEnd = line.indexOf("-->", index);
                  if (commentEnd === -1) return visible;
                  inComment = false;
                  index = commentEnd + 3;
                  continue;
                }

                if (line[index] === "`") {
                  let tickEnd = index + 1;
                  while (line[tickEnd] === "`") tickEnd++;
                  const tickCount = tickEnd - index;
                  if (inlineTicks === 0) {
                    const closingTicks = new RegExp("(^|[^`])" + "`".repeat(tickCount) + "(?!`)");
                    if (closingTicks.test(line.slice(tickEnd))) inlineTicks = tickCount;
                  } else if (tickCount === inlineTicks) {
                    inlineTicks = 0;
                  }
                  visible += line.slice(index, tickEnd);
                  index = tickEnd;
                  continue;
                }

                if (inlineTicks === 0 && line[index - 1] !== "\\" && line.startsWith("<!--", index)) {
                  inComment = true;
                  index += 4;
                  continue;
                }

                visible += line[index];
                index++;
              }
              return visible;
            }).join("\n");
          }

          function markCodeLines(markdown) {
            let fenceMarker = "";

            return markdown.split("\n").map((text) => {
              const leadingMarker = text.match(/^ {0,3}(`+|~+)/)?.[1] || "";
              if (!fenceMarker && leadingMarker.length >= 3) {
                fenceMarker = leadingMarker;
                return { text, isCode: true };
              }

              if (fenceMarker) {
                if (
                  leadingMarker[0] === fenceMarker[0] &&
                  leadingMarker.length >= fenceMarker.length &&
                  text.trimStart().slice(leadingMarker.length).trim() === ""
                ) {
                  fenceMarker = "";
                }
                return { text, isCode: true };
              }

              return { text, isCode: /^(?: {4}|\t)/.test(text) };
            });
          }

          const nextHeading = /^##\s+/;
          const visibleLines = markCodeLines(stripHtmlComments(body));

          const summaryHeading = /^##\s+summary\s*$/i;
          const summaryIndex = visibleLines.findIndex(
            (line) => !line.isCode && summaryHeading.test(line.text.trim()),
          );
          const summaryEndIndex = visibleLines.findIndex(
            (line, index) => index > summaryIndex && !line.isCode && nextHeading.test(line.text.trim()),
          );
          const summaryLines = summaryIndex === -1
            ? []
            : visibleLines.slice(summaryIndex + 1, summaryEndIndex === -1 ? visibleLines.length : summaryEndIndex);
          const intentLabel = /^\*\*Intent:\*\*\s*/i;
          const intentIndex = summaryLines.findIndex(
            (line) => !line.isCode && intentLabel.test(line.text),
          );
          const intent = intentIndex === -1
            ? ""
            : summaryLines[intentIndex].text.replace(intentLabel, "").trim();

          if (intent.length < 20) {
            errors.push(
              "Write at least 20 characters after **Intent:** what problem did you see, and what should this change do instead?",
            );
          }

          if (intent.length > 400) {
            errors.push(
              "Keep **Intent:** to one or two short sentences (400 characters max). Cubic already summarizes the code diff; do not paste a long write-up.",
            );
          }

          const demoHeading = /^##\s+demo\s*$/i;
          const demoIndex = visibleLines.findIndex(
            (line) => !line.isCode && demoHeading.test(line.text.trim()),
          );
          const demoEndIndex = visibleLines.findIndex(
            (line, index) => index > demoIndex && !line.isCode && nextHeading.test(line.text.trim()),
          );
          const demoText = demoIndex === -1
            ? ""
            : visibleLines
                .slice(demoIndex + 1, demoEndIndex === -1 ? visibleLines.length : demoEndIndex)
                .filter((line) => !line.isCode)
                .map((line) => line.text)
                .join("\n")
                .trim();
          const videoLinkPattern = /\bhttps?:\/\/[^\s<>"\x60]+/i;
          const naSkipPattern = /^n\/a\b[ \t]*(?:[-,:—–][ \t]*)?[^\s,:—–-][^\r\n]*$/i;

          if (demoIndex === -1 || demoText.length === 0) {
            errors.push(
              "Add a ## Demo section with a short video/GIF link, or write N/A plus a one-line reason for non-functional changes.",
            );
          } else if (!videoLinkPattern.test(demoText) && !naSkipPattern.test(demoText)) {
            errors.push(
              "## Demo needs a video/GIF link, or N/A plus a one-line reason for non-functional changes.",
            );
          }

          if (errors.length) {
            console.error(errors.map((error) => `- ${error}`).join("\n"));
            process.exit(1);
          }

          console.log("PR title and summary are complete.");

          NODE
