name: mobile_ci

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
  push:
    branches:
      - main
    paths:
      - .github/actions/pnpm_install/**
      - .github/workflows/mobile_ci.yaml
      - apps/mobile/**
      - apps/watch/apple/**
      - crates/db-app/**
      - crates/db-execute/**
      - crates/mobile-bridge/**
      - crates/xtask/**
      - packages/mobile-bridge-rn/**
      - packages/db-react/**
      - packages/db-runtime/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - rust-toolchain.toml
  pull_request:
    paths:
      - .github/actions/pnpm_install/**
      - .github/workflows/mobile_ci.yaml
      - apps/mobile/**
      - apps/watch/apple/**
      - crates/db-app/**
      - crates/db-execute/**
      - crates/mobile-bridge/**
      - crates/xtask/**
      - packages/mobile-bridge-rn/**
      - packages/db-react/**
      - packages/db-runtime/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - rust-toolchain.toml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  EXPO_PUBLIC_API_URL: https://api.anarlog.so
  EXPO_NO_GIT_STATUS: "1"
  SENTRY_DISABLE_AUTO_UPLOAD: "true"

jobs:
  mobile_checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm_install
      - run: pnpm -F @anlg/mobile typecheck
      - run: pnpm -F @anlg/mobile test

  watchos_build:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: depot-macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcodebuild \
            -project apps/watch/apple/AnarlogWatch.xcodeproj \
            -scheme AnarlogWatch \
            -configuration Release \
            -destination "generic/platform=watchOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/AnarlogWatchDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

  ios_build:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: depot-macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm_install
      - uses: ./.github/actions/rust_install
        with:
          platform: ios
      - run: cargo xtask mobile-bridge ios
      - run: |
          pnpm -F @anlg/mobile exec expo run:ios \
            --configuration Release \
            --device generic \
            --output "$RUNNER_TEMP/anarlog-mobile-ios" \
            --no-bundler

  android_build:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/powershell 2> /dev/null || true
          df -h /
      - uses: ./.github/actions/pnpm_install
      - uses: ./.github/actions/rust_install
        with:
          platform: android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: cargo xtask mobile-bridge android
      - run: pnpm -F @anlg/mobile exec expo prebuild --platform android --no-install
      - run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"
        working-directory: apps/mobile/android

  mobile_ci:
    if: always()
    needs: [mobile_checks, watchos_build, ios_build, android_build]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
