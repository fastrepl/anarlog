name: Pro API E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/pro_api_e2e.yaml
      - crates/llm-proxy/**
      - crates/owhisper-client/**
      - crates/soniox/**
      - crates/transcribe-proxy/**
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pro-transcription:
    name: Pro transcription API
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/powershell 2> /dev/null || true
          df -h /
      - uses: ./.github/actions/rust_install
        with:
          platform: linux
      - uses: ./.github/actions/infisical_install
      - name: Test Pro live and batch transcription
        run: |
          infisical run \
            --token="$INFISICAL_TOKEN" \
            --env=dev \
            --projectId=87dad7b5-72a6-4791-9228-b3b86b169db1 \
            --path=/anarlog/stt \
            -- cargo test -p transcribe-proxy --test pro_api_e2e -- --ignored --nocapture
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_STT_TOKEN }}

  pro-intelligence:
    name: Pro intelligence API
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/powershell 2> /dev/null || true
          df -h /
      - uses: ./.github/actions/rust_install
        with:
          platform: linux
      - uses: ./.github/actions/infisical_install
      - name: Test Pro streaming and non-streaming intelligence
        run: |
          infisical run \
            --token="$INFISICAL_TOKEN" \
            --env=dev \
            --projectId=87dad7b5-72a6-4791-9228-b3b86b169db1 \
            --path=/anarlog/llm \
            -- cargo test -p llm-proxy --test proxy_e2e proxy_e2e::openrouter -- --ignored --nocapture
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_LLM_TOKEN }}
