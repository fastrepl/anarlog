on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/desktop-gpui/**
      # Path dependencies and files the native build reads.
      - crates/**
      - plugins/local-llm/swift-lib/**
      - packages/design-system/src/tokens.css
      - apps/desktop/src/i18n/locales.ts
      - apps/desktop/src/session/queries/sessions.ts
      - apps/desktop/src-tauri/icons/dev/32x32.png
      - .cargo/config.toml
      - .github/workflows/gpui_ci.yaml
  push:
    branches: [main]
    paths:
      - apps/desktop-gpui/**
      # Path dependencies and files the native build reads.
      - crates/**
      - plugins/local-llm/swift-lib/**
      - packages/design-system/src/tokens.css
      - apps/desktop/src/i18n/locales.ts
      - apps/desktop/src/session/queries/sessions.ts
      - apps/desktop/src-tauri/icons/dev/32x32.png
      - .cargo/config.toml
      - .github/workflows/gpui_ci.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # The native app has its own workspace and toolchain; rustup resolves it from this directory.
    working-directory: apps/desktop-gpui

jobs:
  macos:
    runs-on: macos-26
    # A cold macOS build of the app and its tests takes about 55 minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop-gpui
          prefix-key: v0-gpui-macos
          # PRs restore main's cache; saving one per PR is slow and pushed macOS past its limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets --no-deps -- -D warnings
      - run: cargo build --locked

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build pkg-config \
            libasound2-dev libudev-dev libpulse-dev libpipewire-0.3-dev libssl-dev \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop-gpui
          prefix-key: v0-gpui-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets --no-deps -- -D warnings
      - run: cargo build --locked
