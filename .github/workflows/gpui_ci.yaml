on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/desktop-gpui/**
      - crates/tiptap/**
      - crates/db-app/migrations/**
      - rust-toolchain.toml
      - Cargo.toml
      - .cargo/config.toml
      - .github/workflows/gpui_ci.yaml
  push:
    branches: [main]
    paths:
      - apps/desktop-gpui/**
      - crates/tiptap/**
      - crates/db-app/migrations/**
      - rust-toolchain.toml
      - Cargo.toml
      - .cargo/config.toml
      - .github/workflows/gpui_ci.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --manifest-path apps/desktop-gpui/Cargo.toml --check
      - run: cargo test --locked --manifest-path apps/desktop-gpui/Cargo.toml
      - run: cargo clippy --locked --manifest-path apps/desktop-gpui/Cargo.toml --all-targets --no-deps -- -D warnings
      - run: cargo build --locked --manifest-path apps/desktop-gpui/Cargo.toml
