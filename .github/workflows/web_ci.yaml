name: web_ci

# https://github.com/tauri-apps/tauri-action/blob/3013cac/examples/test-build-only.yml
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/web/**
      - packages/**
      - .github/workflows/web_ci.yaml
      - .github/workflows/web_cd.yaml
      - .github/actions/pnpm_install/**
      - .github/actions/doxxer_install/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - doxxer.web.toml
  pull_request:
    paths:
      - apps/web/**
      - packages/**
      - .github/workflows/web_ci.yaml
      - .github/workflows/web_cd.yaml
      - .github/actions/pnpm_install/**
      - .github/actions/doxxer_install/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - doxxer.web.toml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/pnpm_install
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
      - run: pnpm -F ui build
      - run: pnpm -F @anlg/supabase typecheck
      - run: pnpm -F @anlg/supabase test
      - run: pnpm -F web typecheck
      - run: pnpm -F web test
      # Fails when a new article has no content/articles/figures.json entry.
      # A declared-but-ungenerated figure only warns; use --strict to gate on it.
      # Public HEAD requests only, so no Napkin or Supabase credentials needed.
      - run: pnpm -F web media:figures:check

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: $/.github/workflows/web_cd.yaml
    with:
      sha: ${{ github.sha }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
      INFISICAL_SENTRY_TOKEN: ${{ secrets.INFISICAL_SENTRY_TOKEN }}
