on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 1.0.2)"
        required: true
        type: string
      candidate_sha:
        description: "Exact 40-character main commit used to build the candidate"
        required: true
        type: string
      dry_run_id:
        description: "Successful publish=false desktop CD run that built the candidate"
        required: true
        type: string
      include_linux:
        description: "Publish Linux beta artifacts from the candidate"
        type: boolean
        default: true
      include_windows:
        description: "Publish Windows artifacts from the candidate"
        type: boolean
        default: true

concurrency:
  group: desktop-stable-release
  cancel-in-progress: false

env:
  CN_APPLICATION: "fastrepl/hyprnote2"

jobs:
  parse:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      channel: ${{ steps.parse.outputs.channel }}
      candidate_sha: ${{ steps.parse.outputs.candidate_sha }}
      dry_run_id: ${{ steps.parse.outputs.dry_run_id }}
      include_linux: ${{ steps.parse.outputs.include_linux }}
      include_windows: ${{ steps.parse.outputs.include_windows }}
    steps:
      - id: parse
        env:
          EXECUTION_REF: ${{ github.ref }}
          EXECUTION_SHA: ${{ github.sha }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          INPUT_DRY_RUN_ID: ${{ inputs.dry_run_id }}
          INPUT_INCLUDE_LINUX: ${{ inputs.include_linux }}
          INPUT_INCLUDE_WINDOWS: ${{ inputs.include_windows }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be a stable semantic version such as 1.4.0"
            exit 1
          fi

          if [[ ! "$INPUT_CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Candidate SHA must be a full 40-character commit SHA"
            exit 1
          fi
          if [[ ! "$INPUT_DRY_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Dry-run workflow ID must be a positive integer"
            exit 1
          fi
          if [[ "$INPUT_INCLUDE_WINDOWS" != "true" ]]; then
            echo "::error::Stable releases must include Windows for automatic Microsoft Store submission"
            exit 1
          fi

          VERSION="$INPUT_VERSION"
          CANDIDATE_SHA="${INPUT_CANDIDATE_SHA,,}"
          if [[ "$EXECUTION_REF" != "refs/heads/main" ]]; then
            echo "::error::Stable publication must run from refs/heads/main, not $EXECUTION_REF"
            exit 1
          fi
          if [[ "${EXECUTION_SHA,,}" != "$CANDIDATE_SHA" ]]; then
            echo "::error::Executing workflow SHA $EXECUTION_SHA does not match candidate $CANDIDATE_SHA"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "channel=stable" >> $GITHUB_OUTPUT
          echo "candidate_sha=$CANDIDATE_SHA" >> $GITHUB_OUTPUT
          echo "dry_run_id=$INPUT_DRY_RUN_ID" >> $GITHUB_OUTPUT
          echo "include_linux=$INPUT_INCLUDE_LINUX" >> $GITHUB_OUTPUT
          echo "include_windows=$INPUT_INCLUDE_WINDOWS" >> $GITHUB_OUTPUT

  verify-candidate:
    needs: parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse.outputs.candidate_sha }}
          fetch-depth: 0
          fetch-tags: true
      - env:
          EXPECTED_SHA: ${{ needs.parse.outputs.candidate_sha }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          git fetch origin main --no-tags

          TARGET=$(git rev-parse HEAD)
          MAIN=$(git rev-parse origin/main)

          if [[ "$TARGET" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checked out $TARGET instead of candidate $EXPECTED_SHA"
            exit 1
          fi

          if [[ "$MAIN" != "$EXPECTED_SHA" ]]; then
            echo "::error::Candidate $EXPECTED_SHA is not the current main commit ($MAIN)"
            exit 1
          fi

          if [[ ! -f "packages/changelog/content/$VERSION.md" ]]; then
            echo "::error::Missing changelog for $VERSION at candidate $EXPECTED_SHA"
            exit 1
          fi

  verify-windows-signature:
    if: ${{ needs.parse.outputs.include_windows == 'true' }}
    needs: [parse, verify-candidate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse.outputs.candidate_sha }}
      - uses: ./.github/actions/cn_download
        with:
          app: ${{ env.CN_APPLICATION }}
          version: ${{ needs.parse.outputs.version }}
          channel: ${{ needs.parse.outputs.channel }}
          platform: nsis-x86_64
          output: anarlog-windows-x86_64-setup.exe
          key: ${{ secrets.CN_API_KEY }}
      - shell: pwsh
        env:
          WINDOWS_SIGNER_ORGANIZATION: ${{ vars.WINDOWS_SIGNER_ORGANIZATION }}
        run: |
          $signature = Get-AuthenticodeSignature "anarlog-windows-x86_64-setup.exe"
          if ($signature.Status -ne "Valid") {
            throw "Invalid Windows Authenticode signature: $($signature.Status)"
          }
          if (-not $signature.SignerCertificate) {
            throw "Windows Authenticode signer certificate is missing"
          }
          $signerOrganization = $signature.SignerCertificate.GetNameInfo(
            [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
            $false
          )
          if ($signerOrganization -ne $env:WINDOWS_SIGNER_ORGANIZATION) {
            throw "Unexpected Windows Authenticode signer '$signerOrganization'"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw "Windows Authenticode signature is missing a trusted timestamp"
          }

  cn-publish:
    needs: [parse, verify-candidate, verify-windows-signature]
    if: ${{ !cancelled() && needs.parse.result == 'success' && needs.verify-candidate.result == 'success' && (needs.parse.outputs.include_windows != 'true' || needs.verify-windows-signature.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse.outputs.candidate_sha }}
          fetch-depth: 0
          fetch-tags: true
      - run: ./scripts/version.sh "./apps/desktop/src-tauri/tauri.conf.json" "${{ needs.parse.outputs.version }}"
      - name: Download candidate provenance
        env:
          EXPECTED_SHA: ${{ needs.parse.outputs.candidate_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ needs.parse.outputs.dry_run_id }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          if ! echo "$RUN" | jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$EXPECTED_SHA" \
            --arg workflow ".github/workflows/desktop_cd.yaml" \
            --argjson run_id "$RUN_ID" \
            '
              .id == $run_id
              and .status == "completed"
              and .conclusion == "success"
              and .run_attempt == 1
              and .event == "workflow_dispatch"
              and (.head_sha | ascii_downcase) == $sha
              and .repository.full_name == $repo
              and .head_repository.full_name == $repo
              and (.path | split("@")[0]) == $workflow
            ' > /dev/null; then
            echo "::error::Run $RUN_ID is not an unrerun, successful desktop CD run for candidate $EXPECTED_SHA"
            exit 1
          fi

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "desktop-release-provenance-$VERSION-$EXPECTED_SHA" \
            --dir release-provenance
      - id: release
        uses: ./.github/actions/cn_release
        with:
          raw: >-
            release show ${{ env.CN_APPLICATION }} ${{ needs.parse.outputs.version }}
            --channel ${{ needs.parse.outputs.channel }}
          key: ${{ secrets.CN_API_KEY }}
      - id: publish-decision
        env:
          RELEASE: ${{ steps.release.outputs.raw }}
          EXPECTED_VERSION: ${{ needs.parse.outputs.version }}
          INCLUDE_LINUX: ${{ needs.parse.outputs.include_linux }}
          INCLUDE_WINDOWS: ${{ needs.parse.outputs.include_windows }}
        run: |
          ACTUAL_VERSION=$(echo "$RELEASE" | jq -r '.version // empty')
          if [[ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Expected CrabNebula release $EXPECTED_VERSION, got $ACTUAL_VERSION"
            exit 1
          fi

          printf '%s' "$RELEASE" > "$RUNNER_TEMP/crabnebula-release.json"
          node scripts/desktop-release-provenance.mjs verify-platforms \
            --release "$RUNNER_TEMP/crabnebula-release.json" \
            --include-linux "$INCLUDE_LINUX" \
            --include-windows "$INCLUDE_WINDOWS"

          STATUS=$(echo "$RELEASE" | jq -r '.status // empty | ascii_downcase')
          case "$STATUS" in
            draft)
              echo "publish_needed=true" >> "$GITHUB_OUTPUT"
              ;;
            published)
              echo "publish_needed=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected CrabNebula release status: $STATUS"
              exit 1
              ;;
          esac
      - name: Verify candidate provenance
        env:
          CN_ASSET_ID: ${{ steps.release.outputs.cli-asset-id }}
          CN_SHA256: ${{ steps.release.outputs.cli-sha256 }}
          CN_VERSION: ${{ steps.release.outputs.cli-version }}
          EXPECTED_SHA: ${{ needs.parse.outputs.candidate_sha }}
          RELEASE: ${{ steps.release.outputs.raw }}
          RUN_ID: ${{ needs.parse.outputs.dry_run_id }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          printf '%s' "$RELEASE" > "$RUNNER_TEMP/crabnebula-release.json"
          node scripts/desktop-release-provenance.mjs verify \
            --release "$RUNNER_TEMP/crabnebula-release.json" \
            --manifest release-provenance/manifest.json \
            --version "$VERSION" \
            --candidate-sha "$EXPECTED_SHA" \
            --run-id "$RUN_ID" \
            --cn-version "$CN_VERSION" \
            --cn-asset-id "$CN_ASSET_ID" \
            --cn-sha256 "$CN_SHA256"
      - name: Create immutable release tag
        env:
          EXPECTED_SHA: ${{ needs.parse.outputs.candidate_sha }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          git fetch origin main --no-tags
          git fetch --tags --force

          TARGET=$(git rev-parse HEAD)
          MAIN=$(git rev-parse origin/main)
          TAG="desktop_v$VERSION"
          EXISTING=$(git rev-parse -q --verify "refs/tags/$TAG" || true)

          if [[ "$TARGET" != "$EXPECTED_SHA" || "$MAIN" != "$EXPECTED_SHA" ]]; then
            echo "::error::Candidate moved before publication (candidate=$EXPECTED_SHA, checkout=$TARGET, main=$MAIN)"
            exit 1
          fi

          if [[ -n "$EXISTING" ]]; then
            if [[ "$EXISTING" != "$EXPECTED_SHA" ]]; then
              echo "::error::Tag $TAG points to $EXISTING instead of candidate $EXPECTED_SHA"
              exit 1
            fi

            echo "Tag $TAG already points to candidate $EXPECTED_SHA"
          else
            git tag "$TAG" "$EXPECTED_SHA"
            git push origin "refs/tags/$TAG"
          fi
      - name: Verify candidate before publication
        if: ${{ steps.publish-decision.outputs.publish_needed == 'true' }}
        env:
          EXPECTED_SHA: ${{ needs.parse.outputs.candidate_sha }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          git fetch origin main --no-tags
          git fetch --tags --force

          TARGET=$(git rev-parse HEAD)
          MAIN=$(git rev-parse origin/main)
          TAG_TARGET=$(git rev-parse "desktop_v$VERSION^{commit}")
          if [[ "$TARGET" != "$EXPECTED_SHA" || "$MAIN" != "$EXPECTED_SHA" || "$TAG_TARGET" != "$EXPECTED_SHA" ]]; then
            echo "::error::Candidate moved before publication (candidate=$EXPECTED_SHA, checkout=$TARGET, main=$MAIN, tag=$TAG_TARGET)"
            exit 1
          fi
      - uses: ./.github/actions/cn_release
        if: ${{ steps.publish-decision.outputs.publish_needed == 'true' }}
        with:
          cmd: publish
          app: ${{ env.CN_APPLICATION }}
          key: ${{ secrets.CN_API_KEY }}
          channel: ${{ needs.parse.outputs.channel }}
          framework: tauri
          working-directory: ./apps/desktop

  gh-release:
    needs: [parse, cn-publish]
    if: ${{ !cancelled() && needs.parse.result == 'success' && needs.cn-publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse.outputs.candidate_sha }}
          fetch-depth: 0
          fetch-tags: true
      - env:
          EXPECTED_SHA: ${{ needs.parse.outputs.candidate_sha }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          git fetch --tags --force

          TAG="desktop_v$VERSION"
          TAG_TARGET=$(git rev-parse "$TAG^{commit}")
          if [[ "$TAG_TARGET" != "$EXPECTED_SHA" ]]; then
            echo "::error::Tag $TAG points to $TAG_TARGET instead of candidate $EXPECTED_SHA"
            exit 1
          fi
      - name: Download candidate provenance
        env:
          EXPECTED_SHA: ${{ needs.parse.outputs.candidate_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ needs.parse.outputs.dry_run_id }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "desktop-release-provenance-$VERSION-$EXPECTED_SHA" \
            --dir release-provenance
      - id: download-macos-aarch64
        uses: ./.github/actions/cn_download
        with:
          app: ${{ env.CN_APPLICATION }}
          version: ${{ needs.parse.outputs.version }}
          channel: ${{ needs.parse.outputs.channel }}
          platform: dmg-aarch64
          output: anarlog-macos-aarch64.dmg
          key: ${{ secrets.CN_API_KEY }}
      - id: download-macos-x86_64
        uses: ./.github/actions/cn_download
        with:
          app: ${{ env.CN_APPLICATION }}
          version: ${{ needs.parse.outputs.version }}
          channel: ${{ needs.parse.outputs.channel }}
          platform: dmg-x86_64
          output: anarlog-macos-x86_64.dmg
          key: ${{ secrets.CN_API_KEY }}
      - id: download-linux-x86_64-appimage
        if: ${{ needs.parse.outputs.include_linux == 'true' }}
        uses: ./.github/actions/cn_download
        with:
          app: ${{ env.CN_APPLICATION }}
          version: ${{ needs.parse.outputs.version }}
          channel: ${{ needs.parse.outputs.channel }}
          platform: appimage-x86_64
          output: anarlog-linux-x86_64.AppImage
          key: ${{ secrets.CN_API_KEY }}
      - id: download-linux-x86_64-deb
        if: ${{ needs.parse.outputs.include_linux == 'true' }}
        uses: ./.github/actions/cn_download
        with:
          app: ${{ env.CN_APPLICATION }}
          version: ${{ needs.parse.outputs.version }}
          channel: ${{ needs.parse.outputs.channel }}
          platform: debian-x86_64
          output: anarlog-linux-x86_64.deb
          key: ${{ secrets.CN_API_KEY }}
      - id: download-linux-aarch64-appimage
        if: ${{ needs.parse.outputs.include_linux == 'true' }}
        uses: ./.github/actions/cn_download
        with:
          app: ${{ env.CN_APPLICATION }}
          version: ${{ needs.parse.outputs.version }}
          channel: ${{ needs.parse.outputs.channel }}
          platform: appimage-aarch64
          output: anarlog-linux-aarch64.AppImage
          key: ${{ secrets.CN_API_KEY }}
      - id: download-linux-aarch64-deb
        if: ${{ needs.parse.outputs.include_linux == 'true' }}
        uses: ./.github/actions/cn_download
        with:
          app: ${{ env.CN_APPLICATION }}
          version: ${{ needs.parse.outputs.version }}
          channel: ${{ needs.parse.outputs.channel }}
          platform: debian-aarch64
          output: anarlog-linux-aarch64.deb
          key: ${{ secrets.CN_API_KEY }}
      - id: download-windows-x86_64
        if: ${{ needs.parse.outputs.include_windows == 'true' }}
        uses: ./.github/actions/cn_download
        with:
          app: ${{ env.CN_APPLICATION }}
          version: ${{ needs.parse.outputs.version }}
          channel: ${{ needs.parse.outputs.channel }}
          platform: nsis-x86_64
          output: anarlog-windows-x86_64-setup.exe
          key: ${{ secrets.CN_API_KEY }}
      - name: Verify GitHub release assets against provenance
        env:
          CN_ASSET_ID: ${{ steps.download-macos-aarch64.outputs.cli-asset-id }}
          CN_SHA256: ${{ steps.download-macos-aarch64.outputs.cli-sha256 }}
          CN_VERSION: ${{ steps.download-macos-aarch64.outputs.cli-version }}
          EXPECTED_SHA: ${{ needs.parse.outputs.candidate_sha }}
          INCLUDE_LINUX: ${{ needs.parse.outputs.include_linux }}
          INCLUDE_WINDOWS: ${{ needs.parse.outputs.include_windows }}
          LINUX_ARM64_APPIMAGE_ID: ${{ steps.download-linux-aarch64-appimage.outputs.asset_id }}
          LINUX_ARM64_DEB_ID: ${{ steps.download-linux-aarch64-deb.outputs.asset_id }}
          LINUX_X64_APPIMAGE_ID: ${{ steps.download-linux-x86_64-appimage.outputs.asset_id }}
          LINUX_X64_DEB_ID: ${{ steps.download-linux-x86_64-deb.outputs.asset_id }}
          MACOS_ARM64_ID: ${{ steps.download-macos-aarch64.outputs.asset_id }}
          MACOS_X64_ID: ${{ steps.download-macos-x86_64.outputs.asset_id }}
          RUN_ID: ${{ needs.parse.outputs.dry_run_id }}
          VERSION: ${{ needs.parse.outputs.version }}
          WINDOWS_X64_ID: ${{ steps.download-windows-x86_64.outputs.asset_id }}
        run: |
          ASSET_DIR="$RUNNER_TEMP/gh-release-assets"
          mkdir -p "$ASSET_DIR"

          copy_asset() {
            local asset_id="$1"
            local source="$2"
            if [[ ! "$asset_id" =~ ^[A-Za-z0-9_-]+$ ]]; then
              echo "::error::Invalid CrabNebula asset ID for $source"
              exit 1
            fi
            if [[ -e "$ASSET_DIR/$asset_id" ]]; then
              echo "::error::Duplicate CrabNebula asset ID $asset_id"
              exit 1
            fi
            cp "$source" "$ASSET_DIR/$asset_id"
          }

          copy_asset "$MACOS_ARM64_ID" "anarlog-macos-aarch64.dmg"
          copy_asset "$MACOS_X64_ID" "anarlog-macos-x86_64.dmg"
          if [[ "$INCLUDE_LINUX" == "true" ]]; then
            copy_asset "$LINUX_X64_APPIMAGE_ID" "anarlog-linux-x86_64.AppImage"
            copy_asset "$LINUX_X64_DEB_ID" "anarlog-linux-x86_64.deb"
            copy_asset "$LINUX_ARM64_APPIMAGE_ID" "anarlog-linux-aarch64.AppImage"
            copy_asset "$LINUX_ARM64_DEB_ID" "anarlog-linux-aarch64.deb"
          fi
          if [[ "$INCLUDE_WINDOWS" == "true" ]]; then
            copy_asset "$WINDOWS_X64_ID" "anarlog-windows-x86_64-setup.exe"
          fi

          PLATFORM_ASSET_IDS=$(jq -cn \
            --arg include_linux "$INCLUDE_LINUX" \
            --arg include_windows "$INCLUDE_WINDOWS" \
            --arg dmg_aarch64 "$MACOS_ARM64_ID" \
            --arg dmg_x86_64 "$MACOS_X64_ID" \
            --arg appimage_x86_64 "$LINUX_X64_APPIMAGE_ID" \
            --arg deb_x86_64 "$LINUX_X64_DEB_ID" \
            --arg appimage_aarch64 "$LINUX_ARM64_APPIMAGE_ID" \
            --arg deb_aarch64 "$LINUX_ARM64_DEB_ID" \
            --arg nsis_x86_64 "$WINDOWS_X64_ID" \
            '{
              "dmg-aarch64": $dmg_aarch64,
              "dmg-x86_64": $dmg_x86_64
            }
            + if $include_linux == "true" then {
                "appimage-x86_64": $appimage_x86_64,
                "debian-x86_64": $deb_x86_64,
                "appimage-aarch64": $appimage_aarch64,
                "debian-aarch64": $deb_aarch64
              } else {} end
            + if $include_windows == "true" then {
                "nsis-x86_64": $nsis_x86_64
              } else {} end')

          node scripts/desktop-release-provenance.mjs verify-assets \
            --manifest release-provenance/manifest.json \
            --asset-dir "$ASSET_DIR" \
            --platform-asset-ids "$PLATFORM_ASSET_IDS" \
            --version "$VERSION" \
            --candidate-sha "$EXPECTED_SHA" \
            --run-id "$RUN_ID" \
            --cn-version "$CN_VERSION" \
            --cn-asset-id "$CN_ASSET_ID" \
            --cn-sha256 "$CN_SHA256"
      - id: checksums
        uses: ./.github/actions/generate_checksums
        with:
          files: |
            anarlog-macos-aarch64.dmg
            anarlog-macos-x86_64.dmg
            ${{ needs.parse.outputs.include_linux == 'true' && 'anarlog-linux-x86_64.AppImage' || '' }}
            ${{ needs.parse.outputs.include_linux == 'true' && 'anarlog-linux-x86_64.deb' || '' }}
            ${{ needs.parse.outputs.include_linux == 'true' && 'anarlog-linux-aarch64.AppImage' || '' }}
            ${{ needs.parse.outputs.include_linux == 'true' && 'anarlog-linux-aarch64.deb' || '' }}
            ${{ needs.parse.outputs.include_windows == 'true' && 'anarlog-windows-x86_64-setup.exe' || '' }}
      - id: release-assets
        env:
          CHECKSUM_FILES: ${{ steps.checksums.outputs.checksum_files }}
          INCLUDE_LINUX: ${{ needs.parse.outputs.include_linux }}
          INCLUDE_WINDOWS: ${{ needs.parse.outputs.include_windows }}
        run: |
          files=(
            "anarlog-macos-aarch64.dmg"
            "anarlog-macos-x86_64.dmg"
          )
          if [[ "$INCLUDE_LINUX" == "true" ]]; then
            files+=(
              "anarlog-linux-x86_64.AppImage"
              "anarlog-linux-x86_64.deb"
              "anarlog-linux-aarch64.AppImage"
              "anarlog-linux-aarch64.deb"
            )
          fi
          if [[ "$INCLUDE_WINDOWS" == "true" ]]; then
            files+=("anarlog-windows-x86_64-setup.exe")
          fi

          artifact_files=$(IFS=,; echo "${files[*]}")
          echo "artifacts=$artifact_files,$CHECKSUM_FILES" >> "$GITHUB_OUTPUT"
      - id: release-body
        run: |
          echo "value=https://anarlog.so/changelog/${{ needs.parse.outputs.version }}" >> "$GITHUB_OUTPUT"
      - uses: ncipollo/release-action@v1
        with:
          tag: desktop_v${{ needs.parse.outputs.version }}
          name: desktop_v${{ needs.parse.outputs.version }}
          body: ${{ steps.release-body.outputs.value }}
          prerelease: false
          artifacts: ${{ steps.release-assets.outputs.artifacts }}
          allowUpdates: true
          makeLatest: true
          replacesArtifacts: true
      - name: Summarize Microsoft Store submission
        if: ${{ needs.parse.outputs.include_windows == 'true' }}
        env:
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          package_url="https://github.com/$GITHUB_REPOSITORY/releases/download/desktop_v$VERSION/anarlog-windows-x86_64-setup.exe"
          package_sha256=$(sha256sum anarlog-windows-x86_64-setup.exe | cut -d ' ' -f 1)
          {
            echo "## Microsoft Store submission"
            echo "- Package URL: \`$package_url\`"
            echo "- SHA-256: \`$package_sha256\`"
            echo "- Silent install argument: \`/S\`"
          } >> "$GITHUB_STEP_SUMMARY"

  store-publish:
    needs: [parse, gh-release]
    if: ${{ !cancelled() && needs.parse.result == 'success' && needs.gh-release.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/desktop_store_publish.yaml
    with:
      version: ${{ needs.parse.outputs.version }}
      candidate_sha: ${{ needs.parse.outputs.candidate_sha }}
      include_windows: true
      submit_to_stores: true
    secrets:
      AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      CN_API_KEY: ${{ secrets.CN_API_KEY }}
      SELLER_ID: ${{ secrets.SELLER_ID }}

  linux-package-bump:
    needs: [parse, gh-release]
    if: ${{ !cancelled() && needs.parse.outputs.include_linux == 'true' && needs.gh-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point anarlog-bin at the published release
        env:
          VERSION: ${{ needs.parse.outputs.version }}
        run: node scripts/update-aur-pkgbuild.mjs --version "$VERSION"
      - id: linux-release
        name: Download published Debian packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/apt-packages"
          gh release download "desktop_v$VERSION" \
            --pattern "anarlog-linux-*.deb" \
            --dir "$RUNNER_TEMP/apt-packages"
          published_at=$(gh release view "desktop_v$VERSION" \
            --json publishedAt \
            --jq .publishedAt)
          echo "published_at=$published_at" >> "$GITHUB_OUTPUT"
      - name: Build and sign the APT repository
        env:
          APT_REPOSITORY_GPG_FINGERPRINT: ${{ vars.APT_REPOSITORY_GPG_FINGERPRINT }}
          APT_REPOSITORY_GPG_PRIVATE_KEY: ${{ secrets.APT_REPOSITORY_GPG_PRIVATE_KEY }}
          PUBLISHED_AT: ${{ steps.linux-release.outputs.published_at }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          if [[ -z "$APT_REPOSITORY_GPG_PRIVATE_KEY" || -z "$APT_REPOSITORY_GPG_FINGERPRINT" ]]; then
            echo "::error::APT repository signing configuration is missing"
            exit 1
          fi

          export GNUPGHOME="$RUNNER_TEMP/apt-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$APT_REPOSITORY_GPG_PRIVATE_KEY" | gpg --batch --import
          if ! gpg --batch --list-secret-keys "$APT_REPOSITORY_GPG_FINGERPRINT" > /dev/null; then
            echo "::error::Imported APT signing key does not match $APT_REPOSITORY_GPG_FINGERPRINT"
            exit 1
          fi
          public_fingerprint=$(gpg --batch --with-colons --show-keys \
            apps/web/public/apt/anarlog-archive-keyring.asc \
            | awk -F: '$1 == "fpr" { print $10; exit }')
          if [[ "$public_fingerprint" != "$APT_REPOSITORY_GPG_FINGERPRINT" ]]; then
            echo "::error::Published APT key $public_fingerprint does not match $APT_REPOSITORY_GPG_FINGERPRINT"
            exit 1
          fi

          node scripts/update-apt-repository.mjs \
            --version "$VERSION" \
            --amd64 "$RUNNER_TEMP/apt-packages/anarlog-linux-x86_64.deb" \
            --arm64 "$RUNNER_TEMP/apt-packages/anarlog-linux-aarch64.deb" \
            --date "$PUBLISHED_AT"

          release_dir="apps/web/public/apt/dists/stable"
          gpg --batch --yes --armor \
            --local-user "$APT_REPOSITORY_GPG_FINGERPRINT" \
            --output "$release_dir/InRelease" \
            --clearsign "$release_dir/Release"
          gpg --batch --yes --armor --detach-sign \
            --local-user "$APT_REPOSITORY_GPG_FINGERPRINT" \
            --output "$release_dir/Release.gpg" \
            "$release_dir/Release"
          gpg --batch --verify "$release_dir/InRelease"
          gpg --batch --verify "$release_dir/Release.gpg" "$release_dir/Release"
      - name: Open the Linux package bump pull request
        env:
          GH_TOKEN: ${{ secrets.REPO_GITHUB_TOKEN }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          if git diff --quiet -- packaging/aur/anarlog-bin apps/web/public/apt; then
            echo "Linux package metadata already tracks $VERSION"
            exit 0
          fi

          BRANCH="chore/linux-packages-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add packaging/aur/anarlog-bin apps/web/public/apt
          git commit -m "chore(packaging): publish Linux packages for $VERSION" \
            -m "Refresh the AUR package and signed APT repository metadata for the desktop_v$VERSION release."
          git push --force origin "$BRANCH"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "Pull request for $BRANCH already open"
            exit 0
          fi

          BODY=$(printf '%s\n' \
            "## Summary" \
            "" \
            "**Problem:** The desktop_v$VERSION release changed Linux artifacts, leaving the AUR package and signed APT repository metadata on the previous version." \
            "" \
            "**Fix:** Refresh the AUR package and signed APT repository metadata so Linux package managers install the current desktop_v$VERSION release." \
            "" \
            "## Verification" \
            "" \
            "- Generated and verified the signed APT repository metadata during the desktop publish run.")

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(packaging): publish Linux packages for $VERSION" \
            --body "$BODY"
