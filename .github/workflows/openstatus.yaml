name: openstatus

on:
  push:
    branches:
      - main
    paths:
      - openstatus.yaml
      - .github/workflows/openstatus.yaml

jobs:
  sync:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3
      - run: brew install openstatusHQ/cli/openstatus --cask
      - run: openstatus monitors apply --access-token ${{ secrets.OPENSTATUS_API_KEY }} -y
