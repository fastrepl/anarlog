name: fmt

on:
  push:
    branches:
      - main
      - .github/workflows/fmt.yaml
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA" > changed-files.nul
            echo "scoped=true" >> "$GITHUB_OUTPUT"
            if grep -zq '\.rs$' changed-files.nul; then echo "rust=true" >> "$GITHUB_OUTPUT"; fi
          else
            echo "scoped=false" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.rust == 'true'
        uses: $/.github/actions/rust_install
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/dprint/cache/plugins
          key: dprint-${{ hashFiles('dprint.json') }}
      - env:
          SCOPED: ${{ steps.changed.outputs.scoped }}
        run: |
          set -euo pipefail
          if [ "$SCOPED" = "true" ]; then
            xargs -0 --no-run-if-empty pnpm exec dprint check --allow-no-files < changed-files.nul
          else
            pnpm fmt:check
          fi
