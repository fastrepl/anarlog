name: fmt

on:
  push:
    branches:
      - main
    paths:
      - "**/*.css"
      - "**/*.html"
      - "**/*.jinja"
      - "**/*.js"
      - "**/*.json"
      - "**/*.jsx"
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.mjs"
      - "**/*.mts"
      - "**/*.rs"
      - "**/*.swift"
      - "**/*.toml"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.wxl"
      - "**/*.wxs"
      - "**/*.yaml"
      - "**/*.yml"
      - "!**/*-lock.json"
      - "!**/*-lock.yaml"
      - dprint.json
      - .oxfmtrc.json
  pull_request:
    paths:
      - "**/*.css"
      - "**/*.html"
      - "**/*.jinja"
      - "**/*.js"
      - "**/*.json"
      - "**/*.jsx"
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.mjs"
      - "**/*.mts"
      - "**/*.rs"
      - "**/*.swift"
      - "**/*.toml"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.wxl"
      - "**/*.wxs"
      - "**/*.yaml"
      - "**/*.yml"
      - "!**/*-lock.json"
      - "!**/*-lock.yaml"
      - dprint.json
      - .oxfmtrc.json
jobs:
  fmt:
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm_install
      - uses: ./.github/actions/rust_install
      - uses: actions/cache@v4
        with:
          path: ~/.cache/dprint/cache/plugins
          key: dprint-${{ hashFiles('dprint.json') }}
      - run: pnpm fmt:check
      - uses: dprint/check@v2.3
        with:
          config-path: dprint.json
