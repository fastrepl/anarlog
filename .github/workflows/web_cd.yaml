on:
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true
      INFISICAL_PROJECT_ID:
        required: true
      INFISICAL_SENTRY_TOKEN:
        required: true

concurrency:
  group: web-vercel-deploy
  cancel-in-progress: false

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - run: git fetch --tags --force
      - uses: ./.github/actions/doxxer_install
      - id: version
        run: |
          VERSION=$(doxxer --config doxxer.web.toml next patch)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION"

  deploy:
    needs: compute-version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.compute-version.outputs.sha }}
      - uses: ./.github/actions/pnpm_install
      - run: |
          : "${VERCEL_TOKEN:?Missing VERCEL_TOKEN repository secret}"
          : "${VERCEL_ORG_ID:?Missing ANARLOG_VERCEL_ORG_ID repository variable}"
          : "${VERCEL_PROJECT_ID:?Missing ANARLOG_VERCEL_PROJECT_ID repository variable}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.ANARLOG_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.ANARLOG_VERCEL_PROJECT_ID }}
      - run: pnpm dlx vercel@59.11.7 pull --yes --environment=production --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.ANARLOG_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.ANARLOG_VERCEL_PROJECT_ID }}
      - run: pnpm dlx vercel@59.11.7 build --prod --token "$VERCEL_TOKEN"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.ANARLOG_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.ANARLOG_VERCEL_PROJECT_ID }}
          NITRO_PRESET: vercel
          SENTRY_BUILD_SOURCEMAPS: "1"
          VITE_APP_URL: https://anarlog.so
          VITE_API_URL: https://api.anarlog.so
          VITE_APP_VERSION: ${{ needs.compute-version.outputs.version }}
      - run: |
          response=$(
            curl --fail --silent --show-error --get \
              --header "Authorization: Bearer $INFISICAL_TOKEN" \
              --data-urlencode "projectId=$INFISICAL_PROJECT_ID" \
              --data-urlencode "environment=prod" \
              --data-urlencode "secretPath=/anarlog/github" \
              --data-urlencode "expandSecretReferences=false" \
              "https://app.infisical.com/api/v4/secrets/SENTRY_AUTH_TOKEN"
          )
          if ! SENTRY_AUTH_TOKEN=$(jq -er '.secret.secretValue | select(length > 0)' <<< "$response"); then
            echo "::error::Missing SENTRY_AUTH_TOKEN in Infisical prod:/anarlog/github"
            exit 1
          fi
          export SENTRY_AUTH_TOKEN

          pnpm -F @anlg/web exec sentry-cli sourcemaps inject ../../.vercel/output
          pnpm -F @anlg/web exec sentry-cli sourcemaps upload \
            --org fastrepl \
            --project anarlog \
            --release "$SENTRY_RELEASE" \
            ../../.vercel/output
          find .vercel/output -type f -name '*.map' -delete
        env:
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_SENTRY_TOKEN }}
          SENTRY_RELEASE: anarlog-web@${{ needs.compute-version.outputs.version }}
      - run: pnpm dlx vercel@59.11.7 deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.ANARLOG_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.ANARLOG_VERCEL_PROJECT_ID }}
      - if: always()
        run: rm -f .vercel/.env.production.local

  tag:
    needs: [compute-version, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.compute-version.outputs.sha }}
      - uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_sha: ${{ needs.compute-version.outputs.sha }}
          custom_tag: web_v${{ needs.compute-version.outputs.version }}
          tag_prefix: ""
