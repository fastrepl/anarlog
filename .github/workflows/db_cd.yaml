# https://supabase.com/docs/guides/deployment/ci/testing

on:
  workflow_dispatch:
    inputs:
      include_all:
        description: Apply reviewed migrations older than the last deployed migration
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v1
        with:
          version: latest
      - run: supabase link --project-ref $PROJECT_ID
      - env:
          INCLUDE_ALL: ${{ inputs.include_all }}
        run: |
          arguments=(db push)
          if [[ "$INCLUDE_ALL" == "true" ]]; then
            arguments+=(--include-all)
          fi
          supabase "${arguments[@]}"
