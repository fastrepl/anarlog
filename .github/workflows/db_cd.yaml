# https://supabase.com/docs/guides/deployment/ci/testing

on:
  workflow_dispatch:
    inputs:
      include_all:
        description: Apply reviewed migrations older than the last deployed migration
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: latest
      - run: supabase link --project-ref $PROJECT_ID
      - env:
          INCLUDE_ALL: ${{ inputs.include_all }}
        run: |
          arguments=(db push)
          if [[ "$INCLUDE_ALL" == "true" ]]; then
            arguments+=(--include-all)
          fi
          supabase "${arguments[@]}"
