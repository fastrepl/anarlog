on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        options:
          - stable
          - beta
      stream:
        description: "Release stream"
        required: true
        default: desktop
        type: choice
        options:
          - desktop
          - mobile
      version:
        description: "Explicit version (defaults to next desktop patch or current mobile version)"
        required: false
        type: string
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      stream:
        required: false
        default: desktop
        type: string
      version:
        required: false
        type: string
      issue_number:
        required: false
        type: number
      comment_id:
        required: false
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - run: git fetch --tags --force

      - if: inputs.comment_id
        uses: ./.github/actions/add-reaction
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          comment: ${{ inputs.comment_id }}
          reaction: eyes

      - uses: ./.github/actions/doxxer_install
      - id: version
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_STREAM: ${{ inputs.stream || 'desktop' }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$RELEASE_STREAM" == "desktop" && "$RELEASE_CHANNEL" == "stable" ]]; then
            VERSION="${RELEASE_VERSION:-$(doxxer --config doxxer.desktop.toml next patch)}"
            PREV=$(git tag -l 'desktop_v*' --sort=-v:refname | grep -E '^desktop_v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          elif [[ "$RELEASE_STREAM" == "mobile" && "$RELEASE_CHANNEL" =~ ^(stable|beta)$ ]]; then
            VERSION="${RELEASE_VERSION:-$(python3 -c 'import json; print(json.load(open("apps/mobile/release-version.json"))["version"])')}"
            PREV=$(CHANGELOG_VERSION="$VERSION" python3 - <<'PYTHON'
          import datetime, json, os, pathlib, re, subprocess
          records = []
          for path in pathlib.Path("packages/changelog/content/mobile").glob("*.json"):
              record = json.loads(path.read_text())
              if record["version"] == os.environ["CHANGELOG_VERSION"]:
                  continue
              if os.environ["RELEASE_CHANNEL"] == "stable" and record["channel"] != "stable":
                  continue
              dates = [datetime.datetime.fromisoformat(item["publishedAt"].replace("Z", "+00:00")) for item in record["availability"]]
              if dates:
                  records.append((min(dates), record["sourceSha"]))
          previous = max(records)[1] if records else subprocess.check_output(["git", "rev-list", "--max-parents=0", "HEAD"], text=True).splitlines()[0]
          if not re.fullmatch(r"[a-f0-9]{40}", previous):
              raise ValueError("Invalid previous mobile source SHA")
          print(previous)
          PYTHON
            )
          else
            echo "::error::Unsupported stream/channel"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid changelog version"
            exit 1
          fi
          echo "file=packages/changelog/content/$RELEASE_STREAM/$VERSION.md" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "stream=$RELEASE_STREAM" >> "$GITHUB_OUTPUT"
          echo "current=HEAD" >> "$GITHUB_OUTPUT"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"

      - uses: anomalyco/opencode/github@latest
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        with:
          model: zai-coding-plan/glm-4.7
          prompt: |
            Read and follow positioning guidelines in `apps/web/content/AGENTS.md`.

            1.
            Create or update ${{ steps.version.outputs.file }}.
            Follow .agents/skills/new-changelog/SKILL.md for the channel contract.
            Nightly notes must never be published in the website changelog.
            Changelog should be generated from commits between ${{ steps.version.outputs.prev }} ~ ${{ steps.version.outputs.current }}.
            Follow guidelines in packages/changelog/content/AGENTS.md.
            Look up each merged PR author. If the PR came from someone
            outside the Fastrepl org (not MEMBER, OWNER, COLLABORATOR, or a
            bot), acknowledge them inline on that changelog item.

            2.
            For desktop notes, run node scripts/sync-desktop-changelogs.mjs
            and include the generated compatibility copies in the same PR.
            For mobile notes, cover only mobile user-facing changes for the
            requested ${{ inputs.channel }} audience. Do not create publication
            records while preparing notes; availability must be verified later.

            Create a PR with title "Prepare ${{ steps.version.outputs.stream }} Changelog for ${{ steps.version.outputs.version }}"

            3. Do not run `typecheck`, `dprint` or `pnpm` things.
