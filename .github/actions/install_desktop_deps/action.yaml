inputs:
  target:
    required: false
    type: string

runs:
  using: "composite"
  steps:
    - if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: xcodebuild -downloadComponent MetalToolchain
    - if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        bash ${{ github.workspace }}/scripts/setup-linux-tauri.sh
        bash ${{ github.workspace }}/scripts/setup-linux-others.sh
