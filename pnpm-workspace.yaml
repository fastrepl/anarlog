packages:
  - apps/*
  - packages/*
  - plugins/*
  - examples/plugins/*
  - e2e/*

publicHoistPattern:
  - "!bun-types"
  - "!@types/bun"

overrides:
  prosemirror-view: "1.41.7"
  lightningcss: "1.30.1"
  protobufjs: "7.6.5"
  seroval: "1.5.3"
  "@xhmikosr/decompress": "10.2.1"

packageExtensions:
  "@sentry/react-native@8.20.0":
    dependencies:
      "@expo/config-plugins": "~57.0.9"
  "react-native-worklets@0.10.1":
    dependencies:
      "@babel/generator": "^7.29.0"
      "@babel/traverse": "^7.29.0"

peerDependencyRules:
  allowedVersions:
    motion: "11"
    react: "19"
    "@lobehub/ui": "3.4.0"
    unist-util-visit: "5"
    esbuild: "0.25"

allowBuilds:
  "@infisical/cli": true
  "@parcel/watcher": true
  "@sentry/cli": true
  cbor-extract: true
  core-js: true
  dprint: true
  edgedriver: true
  esbuild: true
  geckodriver: true
  netlify: true
  protobufjs: true
  puppeteer: true
  sharp: true
  supabase: true
  unix-dgram: true
  workerd: true
