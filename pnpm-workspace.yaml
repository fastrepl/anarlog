packages:
  - apps/*
  - packages/*
  - plugins/*
  - examples/plugins/*
  - e2e/*

publicHoistPattern:
  - "!bun-types"
  - "!@types/bun"

overrides:
  prosemirror-model: "1.25.12"
  prosemirror-view: "1.42.3"
  lightningcss: "1.30.1"
  protobufjs: "7.6.5"
  seroval: "1.5.3"
  "@xhmikosr/decompress": "10.2.1"
  "@humanfs/node@<0.16.8": "0.16.8"
  "@xmldom/xmldom@<0.8.15": "0.8.15"
  "@xmldom/xmldom@>=0.9.0 <0.9.12": "0.9.12"
  "axios@>=1.0.0 <1.18.0": "1.18.0"
  "baseline-browser-mapping@<2.11.0": "2.11.0"
  "brace-expansion@<1.1.18": "1.1.18"
  "brace-expansion@>=2.0.0 <2.1.4": "2.1.4"
  "brace-expansion@>=5.0.0 <5.0.9": "5.0.9"
  "browserslist@<4.28.7": "4.28.7"
  "dompurify@<3.4.13": "3.4.15"
  "fflate@<0.4.9": "0.4.9"
  "hono@<4.13.7": "4.13.7"
  "ip-address@<10.5.1": "10.5.1"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "mermaid@>=11.0.0 <11.16.1": "11.17.2"
  "tar@>=7.0.0 <7.5.21": "7.5.21"
  "undici@>=6.0.0 <6.28.1": "6.28.1"
  "undici@>=7.0.0 <7.29.1": "7.29.1"

packageExtensions:
  "@sentry/react-native@8.20.0":
    dependencies:
      "@expo/config-plugins": "~57.0.9"
  "react-native-worklets@0.10.1":
    dependencies:
      "@babel/generator": "^7.29.0"
      "@babel/traverse": "^7.29.0"

peerDependencyRules:
  allowedVersions:
    motion: "11"
    react: "19"
    "@lobehub/ui": "3.4.0"
    unist-util-visit: "5"
    esbuild: "0.25"

allowBuilds:
  "@infisical/cli": true
  "@parcel/watcher": true
  "@sentry/cli": true
  cbor-extract: true
  core-js: true
  dprint: true
  edgedriver: true
  esbuild: true
  geckodriver: true
  netlify: true
  protobufjs: true
  puppeteer: true
  sharp: true
  supabase: true
  unix-dgram: true
  workerd: true

patchedDependencies:
  # Embed React Scan history, prompts, and inspector in the developer bar.
  react-scan@0.5.7: patches/react-scan@0.5.7.patch
  expo-audio@57.0.4: patches/expo-audio@57.0.4.patch
