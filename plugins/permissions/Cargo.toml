[package]
name = "tauri-plugin-permissions"
version = "0.1.0"
authors = [ "You" ]
description = ""
edition = "2024"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-permissions"

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
specta-typescript = { workspace = true }
tokio = { workspace = true, features = ["macros"] }

[dependencies]
anlg-audio = { workspace = true }

tauri = { workspace = true, features = ["specta", "test"] }
tauri-plugin-shell = { workspace = true }
tauri-plugin-sidecar2 = { workspace = true }

specta = { workspace = true }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }

serde = { workspace = true }
thiserror = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }

[target."cfg(target_os = \"macos\")".dependencies]
anlg-bundle = { workspace = true }
anlg-overlay-kit = { workspace = true }
anlg-tcc = { workspace = true, optional = true }
block2 = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-av-foundation = { workspace = true }
objc2-contacts = { workspace = true, features = ["CNContactStore", "block2"] }
objc2-core-foundation = { workspace = true }
objc2-core-graphics = { workspace = true }
objc2-event-kit = { workspace = true, features = ["EKEventStore", "EKTypes", "block2"] }
objc2-foundation = { workspace = true, features = [
  "NSArray",
  "NSBundle",
  "NSData",
  "NSDictionary",
  "NSGeometry",
  "NSObject",
  "NSObjCRuntime",
  "NSString",
  "NSThread",
  "NSTimer",
  "NSURL",
  "NSValue",
] }
objc2-quartz-core = { workspace = true }
macos-accessibility-client = { workspace = true }

[features]
default = []
private-tcc = ["dep:anlg-tcc"]
