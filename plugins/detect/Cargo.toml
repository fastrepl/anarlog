[package]
name = "tauri-plugin-detect"
version = "0.1.0"
authors = ["You"]
edition = "2024"
exclude = ["/js", "/node_modules"]
links = "tauri-plugin-detect"
description = ""

[features]
default = ["zoom", "sleep"]
zoom = ["anlg-detect/zoom"]
language = ["anlg-detect/language"]
sleep = ["anlg-detect/sleep"]
test-support = []

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
anlg-db-core = { workspace = true }
anlg-detect = { workspace = true, features = ["mic"] }
specta-typescript = { workspace = true }
tauri-plugin-detect = { path = ".", features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[dependencies]
anlg-audio = { workspace = true }
anlg-db-app = { workspace = true }
anlg-detect = { workspace = true, features = ["mic", "list", "language", "sleep", "screen"] }
anlg-notification-interface = { workspace = true }

tauri = { workspace = true, features = ["specta", "test"] }
tauri-plugin-db = { workspace = true }
tauri-plugin-settings = { workspace = true }
tauri-plugin-windows = { workspace = true }

specta = { workspace = true }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }

serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "sqlite-unbundled"] }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[target."cfg(target_os = \"macos\")".dependencies]
base64 = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSBitmapImageRep", "NSImage", "NSImageRep", "NSWorkspace"] }
objc2-foundation = { workspace = true, features = ["NSData", "NSDictionary", "NSString"] }
