[package]
name = "tauri-plugin-session"
version = "0.1.0"
authors = ["You"]
edition = "2024"
exclude = ["/node_modules"]
links = "tauri-plugin-session"
description = ""

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
anlg-db-core = { workspace = true }
specta-typescript = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[dependencies]
anlg-db-app = { workspace = true }
tauri-plugin-db = { workspace = true }

chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "sqlite-unbundled", "macros"] }

specta = { workspace = true, features = ["serde_json"] }
tauri = { workspace = true, features = ["test"] }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }
uuid = { workspace = true, features = ["v4"] }
