[package]
name = "anarlog-enterprise-control-plane"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
anlg-meeting-capture.workspace = true
anlg-session-ingest.workspace = true

anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["json", "query", "tokio"] }
chrono = { workspace = true, features = ["serde"] }
http.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { workspace = true, features = ["limit", "request-id", "trace"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
anarlog-enterprise-google-meet-worker = { path = "../google-meet-worker" }
anlg-agent-access.workspace = true
anlg-db-app.workspace = true
anlg-db-core.workspace = true
anlg-session-ingest = { workspace = true, features = ["apply"] }
reqwest.workspace = true
tower = { workspace = true, features = ["util"] }
