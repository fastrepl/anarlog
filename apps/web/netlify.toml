# https://docs.netlify.com/build/configure-builds/overview/#definitions
# We must set package="apps/web" in the UI
[build]
command = "pnpm -F @anlg/ui build && VITE_APP_VERSION=${VITE_APP_VERSION:-$COMMIT_REF} pnpm -F @anlg/web build"
publish = "apps/web/dist/client"
ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF apps/web packages/api-client packages/changelog packages/ui packages/utils package.json pnpm-lock.yaml"

[build.environment]
VITE_APP_URL = "https://anarlog.so"
VITE_API_URL = "https://api.anarlog.so"
NODE_OPTIONS = "--max-old-space-size=4096"
NODE_VERSION = "22"

[functions]
included_files = [
  "public/fonts/**",
  "apps/web/public/fonts/**",
]

[images]
# https://docs.netlify.com/build/image-cdn/overview/#remote-path
remote_images = [
  "https://char\\.com/.*",
  "https://hyprnote\\.com/.*",
  "https://ijoptyyjrfqwaqhyxkxj\\.supabase\\.co/.*",
]

[[headers]]
for = "/images/blog/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
X-Content-Type-Options = "nosniff"

# Preserve old indexed image URLs without keeping the Supabase blog bucket.
[[redirects]]
from = "/api/assets/blog/*"
to = "/images/blog/:splat"
status = 301
force = true

# Keep APT metadata on anarlog.so while immutable package binaries stay on the
# matching GitHub release. The release segment is preserved end-to-end.
[[redirects]]
from = "/apt/pool/:release/amd64/anarlog.deb"
to = "https://github.com/fastrepl/anarlog/releases/download/:release/anarlog-linux-x86_64.deb"
status = 302
force = true

[[redirects]]
from = "/apt/pool/:release/arm64/anarlog.deb"
to = "https://github.com/fastrepl/anarlog/releases/download/:release/anarlog-linux-aarch64.deb"
status = 302
force = true

# Desktop updater JSON and installer binaries stay on CrabNebula. Serve them
# from desktop.anarlog.so so they do not collide with the marketing site.
# desktop2.hyprnote.com already CNAMEs here; also HTTP-redirect so existing
# Homebrew/download URLs land on the canonical host.
[[redirects]]
from = "https://desktop.anarlog.so/update/*"
to = "https://cdn.crabnebula.app/update/fastrepl/hyprnote2/:splat"
status = 302
force = true

[[redirects]]
from = "https://desktop.anarlog.so/download/*"
to = "https://cdn.crabnebula.app/download/fastrepl/hyprnote2/:splat"
status = 302
force = true

[[redirects]]
from = "https://desktop.anarlog.so/"
to = "https://anarlog.so/download"
status = 302
force = true

[[redirects]]
from = "https://desktop2.hyprnote.com/*"
to = "https://desktop.anarlog.so/:splat"
status = 302
force = true

[[headers]]
for = "/apt/dists/*"
[headers.values]
Cache-Control = "public, max-age=300, must-revalidate"
X-Content-Type-Options = "nosniff"

[[headers]]
for = "/apt/anarlog-archive-keyring.asc"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
X-Content-Type-Options = "nosniff"

# Anarlog documentation and agent discovery
