app = 'hyprnote-stripe'
primary_region = 'sjc'
kill_signal = 'SIGTERM'
# Fly caps this at 300s. Accepted requests can last longer, so stripe_cd uses
# cordoned replacement Machines + SIGUSR1 and leaves old Machines up until idle.
kill_timeout = 300
swap_size_mb = 512

[[restart]]
policy = "on-failure"
processes = ["app"]

[env]
NODE_ENV = "production"
PORT = "8080"

[http_service]
processes = ['app']
internal_port = 8080
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 2

[http_service.http_options]
idle_timeout = 660

[http_service.concurrency]
type = "requests"
hard_limit = 200
soft_limit = 150

[[http_service.checks]]
grace_period = "20s"
interval = "15s"
method = "GET"
path = "/health"
protocol = "http"
timeout = "4s"

[[vm]]
processes = ['app']
memory = '512mb'
cpu_kind = 'shared'
cpus = 1
