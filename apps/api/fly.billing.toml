app = 'anarlog-billing-api'
primary_region = 'sjc'
kill_signal = 'SIGTERM'
# Fly caps this at 300s. Accepted billing work can last longer, so api_cd uses
# cordoned replacement Machines + SIGUSR1 and leaves old Machines up until requests and seat jobs finish.
kill_timeout = 300
swap_size_mb = 512

[[restart]]
policy = "on-failure"
processes = ["app"]

[build]
build-target = "billing-runtime"

[env]
NODE_ENV = "production"
BILLING_API_BINARY = "/usr/local/bin/api"
ANARLOG_BILLING_WEBHOOKS = "true"
ANARLOG_SERVICE = "billing"
ANARLOG_ATTACHMENT_BACKUP_GC_ENABLED = "false"
PORT = "3001"

[http_service]
processes = ['app']
internal_port = 3001
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 2

[http_service.http_options]
idle_timeout = 660

[http_service.concurrency]
type = "connections"
hard_limit = 200
soft_limit = 150

[[http_service.checks]]
grace_period = "20s"
interval = "15s"
method = "GET"
path = "/health/ready/billing-unified"
protocol = "http"
timeout = "4s"

[[vm]]
processes = ['app']
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
