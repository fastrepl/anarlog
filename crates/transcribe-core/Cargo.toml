[package]
name = "transcribe-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["vad"]
vad = ["anlg-audio-chunking/vad"]

[dependencies]
anlg-audio-chunking = { path = "../audio-chunking", package = "audio-chunking", default-features = false }
anlg-audio-utils = { workspace = true }
owhisper-interface = { workspace = true }

axum = { workspace = true, features = ["ws"] }
futures-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
