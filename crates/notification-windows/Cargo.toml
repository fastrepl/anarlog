[package]
name = "notification-windows"
version = "0.1.0"
edition = "2024"

[dependencies]
anlg-notification-interface = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
indexmap = "2.6"
tracing = { workspace = true }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
