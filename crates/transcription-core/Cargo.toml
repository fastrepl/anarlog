[package]
name = "transcription-core"
version = "0.1.0"
edition = "2024"
description = ""

[features]
default = []
specta = [
  "anlg-listener-core/specta",
  "anlg-listener2-core/specta",
]
tauri-event = [
  "anlg-listener-core/tauri-event",
  "anlg-listener2-core/tauri-event",
]

[dependencies]
anlg-audio = { workspace = true }
anlg-listener-core = { workspace = true }
anlg-listener2-core = { workspace = true }
anlg-transcript = { workspace = true }

futures-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
anlg-storage = { workspace = true }
ractor = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-tungstenite = { workspace = true }
