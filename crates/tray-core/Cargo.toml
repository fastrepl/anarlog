[package]
name = "tray-core"
version = "0.1.0"
edition = "2024"

[features]
default = []
specta = ["dep:specta"]
contract-fixtures = ["dep:serde_json"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
specta = { workspace = true, optional = true }
unicode-width = { workspace = true }

[dev-dependencies]
anlg-tray-core = { path = ".", package = "tray-core", features = ["contract-fixtures"] }
serde_json = { workspace = true }
