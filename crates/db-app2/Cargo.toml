[package]
name = "db-app2"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Opt-in so that storage types can travel directly across the HTTP / IPC
# boundary (used by `hypr-api`) without being re-declared downstream.
serde = ["dep:serde"]
specta = ["dep:specta", "serde"]

[dependencies]
hypr-db-core = { workspace = true }
hypr-db-migrate = { workspace = true }

serde = { workspace = true, optional = true, features = ["derive"] }
specta = { workspace = true, optional = true, features = ["derive"] }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "sqlite-unbundled", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
