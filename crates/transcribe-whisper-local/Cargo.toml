[package]
name = "transcribe-whisper-local"
version = "0.1.0"
edition = "2024"

[features]
default = ["streaming"]
streaming = [
  "anlg-audio-chunking/vad",
  "anlg-transcribe-core/vad",
  "dep:anlg-audio-interface",
  "dep:anlg-ws-utils",
  "dep:tower",
]
coreml = ["anlg-whisper-local/coreml"]
directml = ["dep:anlg-pyannote-local", "anlg-pyannote-local/directml"]
cuda = ["anlg-whisper-local/cuda"]
hipblas = ["anlg-whisper-local/hipblas"]
openblas = ["anlg-whisper-local/openblas"]
metal = ["anlg-whisper-local/metal"]
vulkan = ["anlg-whisper-local/vulkan"]
openmp = ["anlg-whisper-local/openmp"]
[dev-dependencies]
anlg-data = { workspace = true }
bytes = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
owhisper-client = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
tokio-tungstenite = { workspace = true }

[dependencies]
anlg-audio-chunking = { path = "../audio-chunking", package = "audio-chunking", default-features = false }
anlg-audio-interface = { workspace = true, optional = true }
anlg-audio-utils = { workspace = true }
anlg-model-manager = { workspace = true, features = ["whisper-local"] }
anlg-pyannote-local = { workspace = true, optional = true }
anlg-transcribe-core = { path = "../transcribe-core", package = "transcribe-core", default-features = false }
anlg-whisper = { workspace = true }
anlg-whisper-local = { workspace = true }
anlg-ws-utils = { workspace = true, optional = true }
owhisper-interface = { workspace = true }

bytes = { workspace = true }
serde_html_form = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

axum = { workspace = true, features = ["ws"] }
futures-util = { workspace = true }
hound = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
tower = { workspace = true, optional = true }
tracing = { workspace = true }

rodio = { workspace = true }
serde = { workspace = true }
