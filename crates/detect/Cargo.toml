[package]
name = "detect"
version = "0.1.0"
edition = "2024"

[features]
default = []
mic = []
language = []
list = []
app = []
zoom = []
sleep = []
screen = ["dep:xcap", "dep:image"]

[dependencies]
sysinfo = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tracing = { workspace = true }

serde = { workspace = true, features = ["derive"] }
specta = { workspace = true, features = ["derive"] }
sys-locale = { workspace = true }

anlg-language = { workspace = true }

image = { workspace = true, features = ["jpeg"], optional = true }

[target."cfg(target_os = \"macos\")".dependencies]
anlg-bundle = { workspace = true }

plist = "1.7"
cidre = { workspace = true, features = ["ax"] }
block2 = { workspace = true }

objc2-foundation = { workspace = true, features = ["NSArray", "NSString"] }
objc2-app-kit = { workspace = true, features = ["NSWorkspace", "NSRunningApplication", "libc"] }
objc2 = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-application-services = { workspace = true }
macos-accessibility-client = { workspace = true }

[[example]]
name = "detector"
required-features = ["mic", "list", "zoom", "sleep", "app", "language"]

# xcap's Linux backend links libgbm/EGL/PipeWire; Linux capture is not supported yet.
[target."cfg(any(target_os = \"macos\", target_os = \"windows\"))".dependencies]
xcap = { workspace = true, optional = true }

[target."cfg(target_os = \"linux\")".dependencies]
libpulse-binding = "2.30"
atspi = { version = "0.25", default-features = false, features = ["tokio"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target."cfg(target_os = \"windows\")".dependencies]
winreg = "0.55"
wasapi = { workspace = true }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
