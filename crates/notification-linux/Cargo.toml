[package]
name = "notification-linux"
version = "0.1.0"
edition = "2024"

[features]
linux-examples = []

[[example]]
name = "test_notification"
required-features = ["linux-examples"]

[dev-dependencies]
tokio = { workspace = true }

[dependencies]
anlg-notification-interface = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18"
gdk-pixbuf = "0.18"
# Must match gtk 0.18's glib; gtk3-rs ended at 0.18, so glib cannot move on its own.
glib = "0.18"
gtk = "0.18"
pango = "0.18"
indexmap = "2.6"
tracing = { workspace = true }
